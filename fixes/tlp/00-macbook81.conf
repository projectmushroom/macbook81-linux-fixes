# MacBook8,1 battery tuning
# PCIe ASPM: deepest link states on battery
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Runtime PM for all PCI devices on AC too — the FaceTime camera has no
# driver and is never used, so it should always sit in D3
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
# pci-stub MUST stay denylisted: 8086:9ce0 (LPSS DMA) is stubbed to keep
# the SPI keyboard on PIO — do not let TLP touch it
RUNTIME_PM_DRIVER_DENYLIST="mei_me nvme pci-stub pcieport"
# Pin the stubbed LPSS DMA device by address too — TLP 1.10 set it to auto
# despite the pci-stub driver denylist entry
RUNTIME_PM_DENYLIST="00:15.0"

CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
