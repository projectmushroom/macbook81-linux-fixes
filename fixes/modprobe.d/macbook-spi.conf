# MacBook8,1 (12" 2015): internal keyboard/trackpad.
#
# Root cause: the LPSS DMA controller at 0000:00:15.0 never receives its
# interrupt (IRQ 20 stays at 0 forever). When spi-pxa2xx gets a DMA channel it
# uses the DMA completion path -- which depends on that dead interrupt -- and
# never enables the SPI controller's own (working) IRQ 21, so every applespi
# transfer times out with -110.
#
# The REAL fix is on the kernel cmdline, because dw_dmac_pci is BUILT INTO the
# CachyOS kernel (CONFIG_DW_DMAC_PCI=y) and modprobe blacklists cannot stop a
# built-in driver:
#
#     pci-stub.ids=8086:9ce0     (in /etc/limine-entry-tool.d/20-macbook.conf)
#
# pci-stub (also built-in) claims the DMA controller first, dw_dmac_pci never
# binds, spi-pxa2xx logs "no DMA channels available, using PIO" and completes
# transfers via IRQ 21. This is also why Debian/Ubuntu work out of the box:
# they build dw_dmac_pci as a module, which isn't loaded when the SPI driver
# probes, so they land on the PIO path by accident.
#
# The blacklist below only covers the loadable platform variant (dw_dmac,
# autoloaded via ACPI alias INTL9C60) so nothing else grabs the device either.
# It is belt-and-braces, not the fix.
blacklist dw_dmac
blacklist dw_dmac_pci
