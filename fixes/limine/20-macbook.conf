# MacBook8,1 hardware workarounds (limine-entry-tool drop-in;
# install to /etc/limine-entry-tool.d/).
#
#   pci-stub.ids=8086:9ce0 - the LPSS DMA controller at 0000:00:15.0 never
#     delivers its interrupt on this machine. If a dw_dmac driver binds it,
#     spi-pxa2xx takes the DMA path and every applespi transfer times out
#     (-110), killing the internal keyboard/trackpad. Stubbing the device
#     forces the SPI driver onto the PIO path, whose IRQ works.
#
#   acpi_backlight=native - use i915 intel_backlight instead of the coarse
#     acpi_video0.
KERNEL_CMDLINE[default]+=" pci-stub.ids=8086:9ce0 acpi_backlight=native"
